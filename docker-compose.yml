version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: researchgpt-api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - SQLITE_DB_PATH=/app/data/researchgpt.db
    volumes:
      - researchgpt_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: researchgpt-frontend
    command: ["streamlit", "run", "frontend/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    volumes:
      - researchgpt_data:/app/data
    restart: unless-stopped

volumes:
  researchgpt_data:
